services:
  postgres:
    image: postgres:16
    container_name: nexusai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexusai
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: change_this_local_password
    ports:
      - "5432:5432"
    volumes:
      - nexus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexusai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nexus_postgres_data:
